<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador CNV S4</title>
<style>


:root{
  --deep:#003641; --teal:#00AE9D; --green:#7DB61C; --purple:#49479D;
  --ground:#eef2f2; --card:#fff; --surf:#f4f8f8; --line:#dee7e8; --hover:#f9fcfc;
  --ink:#12262b; --mut:#66797e; --zero:#c2cdcf; --bd:#ccd8da;
  --sim:#fafdf7; --simh:#edf6e9; --simhf:#4a6b23;
  --tot:#f1faf8; --toth:#e7f3f2; --tothf:#065f56;
  --pos:#0d7a4a; --neg:#a4262c;
  --yb:#e3f4e1; --yf:#2c6b1f; --nb:#fdeaea; --nf:#a4262c; --zb:#eff3f3; --zf:#aebbbd;
  --deepfg:#003641; --medal:#B8860B; --warnbg:#fdf7ec; --sumtot:#e1f1ef;
  --tc1:#00756B; --tc2:#557F13; --tc3:#403E92;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--ground);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1300px;margin:0 auto;padding:0 24px}











.selbar{background:var(--card);border-bottom:1px solid var(--line);padding:15px 0}
.selgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px}
.selg{display:flex;flex-direction:column}
.selg label{font-size:10px;font-weight:800;color:var(--mut);margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}
.selg select{padding:9px 10px;border:1px solid var(--bd);border-radius:7px;font-size:13px;background:var(--card);color:var(--ink);font-family:inherit;font-weight:600;cursor:pointer}
.selg select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,174,157,.15)}
.selg select:disabled{background:var(--surf);color:var(--zero);cursor:not-allowed}

.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px;padding:20px 0 0}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:3px solid var(--teal)}
.c.op{border-top-color:var(--purple)}
.c.gp{background:var(--deep);border-color:var(--deep);color:#fff}
.c .lb{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.c.gp .lb{color:rgba(255,255,255,.6)}
.c .nm{font-size:13.5px;font-weight:700;color:var(--deepfg);margin:5px 0 8px}
.c.gp .nm{color:#fff}
.c .vv{font-size:27px;font-weight:800;line-height:1}
.cstats{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.cstat .vv{font-size:27px;font-weight:800;line-height:1;display:block}
.cstat .sb{margin-top:5px}
.cstat.pos .vv{color:var(--deepfg)}
.medal{color:var(--medal)}
.c .sb{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.45}
.c.gp .sb{color:rgba(255,255,255,.7)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:5px;background:var(--green);color:#173d00;margin-left:5px;vertical-align:1px}

.tabs{display:flex;gap:6px;padding:18px 0 0;overflow-x:auto}
.tab{position:relative;padding:11px 20px 12px;font-size:13px;font-weight:700;cursor:pointer;border-radius:10px 10px 0 0;
  white-space:nowrap;border:1px solid transparent;border-bottom:none;font-family:inherit;
  color:var(--tc);background:var(--tcb);transition:background .15s,color .15s}
.tab:hover{background:var(--tch)}
.tab.active{background:var(--card);border-color:var(--line);color:var(--tc)}
.tab.active::after{content:'';position:absolute;left:-1px;right:-1px;top:-1px;height:3px;border-radius:10px 10px 0 0;background:var(--tbar)}
.tab .tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tbar);margin-right:8px;vertical-align:1px;opacity:.55}
.tab.active .tdot{opacity:1}
.tabs .tab:nth-child(1){--tc:var(--tc1);--tbar:#00AE9D;--tcb:rgba(0,174,157,.10);--tch:rgba(0,174,157,.18)}
.tabs .tab:nth-child(2){--tc:var(--tc2);--tbar:#7DB61C;--tcb:rgba(125,182,28,.13);--tch:rgba(125,182,28,.22)}
.tabs .tab:nth-child(3){--tc:var(--tc3);--tbar:#49479D;--tcb:rgba(73,71,157,.10);--tch:rgba(73,71,157,.18)}
.tabs .tab:nth-child(4){--tc:#8a5a12;--tbar:#E8A33D;--tcb:rgba(232,163,61,.14);--tch:rgba(232,163,61,.22)}
#p-a{--pc:#00AE9D}#p-b{--pc:#7DB61C}#p-c{--pc:#49479D}#p-d{--pc:#E8A33D}
.pane{display:none;background:var(--card);border:1px solid var(--line);border-top:2px solid var(--pc);
  border-radius:0 12px 12px 12px;padding:20px;margin-bottom:32px}
.pane.active{display:block}
.blk{margin-bottom:24px}.blk:last-child{margin-bottom:0}
.bt{font-size:13px;font-weight:800;color:var(--deepfg);display:flex;align-items:center;gap:7px;margin-bottom:9px}
.bt::before{content:'';width:3px;height:14px;background:var(--teal);border-radius:2px}
.bt.op::before{background:var(--purple)}
.bt.gr::before{background:var(--green)}
.note{font-size:11.5px;color:var(--mut);line-height:1.55;margin-top:7px}
.tip{background:var(--surf);border-left:3px solid var(--teal);border-radius:0 7px 7px 0;padding:11px 13px;font-size:12.5px;line-height:1.55}
.tip.w{border-left-color:#E8A33D;background:var(--warnbg)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:800px;background:var(--card)}
thead th{background:var(--surf);color:var(--mut);font-weight:800;padding:9px 7px;text-align:center;border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
thead th:first-child{text-align:left;padding-left:14px;min-width:165px}
thead th.s{background:var(--simh);color:var(--simhf)}
thead th.t{background:var(--toth);color:var(--tothf)}
tbody td{padding:7px;text-align:center;border-bottom:1px solid var(--line)}
tbody td:first-child{text-align:left;font-weight:600;padding-left:14px}
tbody td.s{background:var(--sim)}
tbody td.t{background:var(--tot);font-weight:800;color:var(--deepfg)}
tbody tr.sum td{background:var(--surf);font-weight:800;color:var(--deepfg)}
tbody tr.sum td.t{background:var(--sumtot)}
tbody tr:hover td{background:var(--hover)}
tbody tr.sum:hover td{background:var(--surf)}
.z{color:var(--zero)}.pos{color:var(--pos)}.neg{color:var(--neg)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
input[type=number]{width:56px;padding:4px;font-size:12px;text-align:center;border:1px solid var(--bd);border-radius:5px;font-family:inherit;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
input[type=number]:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px rgba(125,182,28,.2)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.hit{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 5px;border-radius:6px;font-size:11.5px;font-weight:800}
.hit.y{background:var(--yb);color:var(--yf)}.hit.n{background:var(--nb);color:var(--nf)}.hit.a{background:var(--zb);color:var(--zf)}.hit.p{background:#fdf1de;color:#8a5a12}
th.nf{background:#fdf1de;color:#8a5a12}
td.nf{background:#fffaf3}
td.nf input{width:64px;border-color:#e8c68a}
td.ed input{width:64px}
.btnr{margin-left:8px;padding:5px 11px;font-size:11.5px;font-weight:700;font-family:inherit;color:var(--deepfg);background:var(--surf);border:1px solid var(--bd);border-radius:7px;cursor:pointer}
.btnr:hover{background:var(--toth);border-color:var(--teal)}
.medcard{font-size:15px;margin-right:4px}
.sm{font-size:10.5px;color:var(--mut);display:block;margin-top:2px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-bottom:10px;font-weight:600}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.leg i.y{background:var(--yb)}.leg i.n{background:var(--nb)}.leg i.p{background:#fdf1de}.leg i.a{background:var(--zb)}
.proj{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:9px;font-weight:600}
.proj label{display:flex;gap:5px;align-items:center;cursor:pointer;color:var(--ink)}
.proj input{accent-color:var(--teal);cursor:pointer}
.empty{text-align:center;padding:50px 20px;color:var(--mut);font-size:13.5px;line-height:1.7}
@media(max-width:820px){.cards{grid-template-columns:1fr}.selgrid{grid-template-columns:1fr 1fr}}

.sm2{text-align:left !important;font-weight:700;color:var(--mut);font-size:11px;white-space:nowrap;padding-left:10px !important}
tbody tr.sep td{border-bottom:2px solid var(--line)}
td.mpin{padding:3px !important}
td.mpin input{width:74px}
/* ===== CABEÇALHO SICOOB ===== */
.hdr{position:relative;background:#003641;color:#fff;overflow:hidden}
.hdr::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 16px);
  pointer-events:none}
.hdr::after{content:'';position:absolute;top:-140px;right:-120px;width:460px;height:460px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,174,157,.22) 0%,rgba(0,174,157,0) 68%);pointer-events:none}
.hdr .wrap{position:relative;z-index:2;display:flex;align-items:center;gap:26px;flex-wrap:wrap;padding:20px 24px}
.brand{flex:none;display:flex;align-items:center}
.brand img{height:38px;width:auto;display:block}
.vr{flex:none;width:1px;align-self:stretch;min-height:46px;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.28) 22%,rgba(255,255,255,.28) 78%,transparent)}
.ttl{flex:1;min-width:230px;display:flex;align-items:center;gap:16px}
.slash{flex:none;display:flex;align-items:center;gap:5px}
.slash i{display:block;width:9px;height:22px;transform:skewX(-20deg);border-radius:1px}
.slash i:nth-child(1){background:#00AE9D;opacity:.45}
.slash i:nth-child(2){background:#00AE9D;opacity:.75}
.slash i:nth-child(3){background:#7DB61C}
.slash i:nth-child(4){background:#C8D400}
.hdr h1{font-size:27px;font-weight:800;letter-spacing:.4px;line-height:1.05;text-transform:uppercase}
.hdr h1 b{color:#00D6C1;font-weight:800}
.hdr p{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.55);margin-top:5px}
.chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:8px 15px;
  border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(0,214,193,.35);
  color:#8FEFE2;white-space:nowrap;font-variant-numeric:tabular-nums}
.accent{height:4px;background:linear-gradient(90deg,#7DB61C 0%,#C8D400 22%,#00AE9D 62%,#49479D 100%)}
@media(max-width:760px){.hdr .wrap{gap:14px;padding:16px 24px}.vr{display:none}
  .hdr h1{font-size:21px}.slash{display:none}.chips{margin-left:0;width:100%}}
</style>
</head>

var MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function thcls(m){return m>=NM?' class="s"':(m>=MF?' class="nf"':'')}
var OPL='1º lugar', OPO='1º';

/* combos e produtos na visão cooperativa — Venda Nova PA é só de PA e não entra */
var CB=[
 {k:'ESC', n:'Escolher o Sicoob',        c:'#49479D', p:[]},

];
var SIM={}, OSIM={}, st={c1:'',c2:'',cb:'ALL',proj:'m3'};
var PSIM={};
/* ajuste dela para os meses realizados que ainda nao fecharam (m entre MF e NM-1) */
function pkey(k,rid,m){return k+'|'+rid+'_'+m}
function val(r,k,m){var o=PSIM[pkey(k,r.id,m)];return o===undefined?r.get(k,m):o}
function setP(k,rid,m,x){var ky=k+'|'+rid+'_'+m;if(isNaN(x)||x<0)delete PSIM[ky];else PSIM[ky]=x;draw()}

function resetP(){PSIM={};draw()}
var MT=D.MT, PR=D.PR, MSIM={};
function meta(k,pi,m){var a=MT[k];return a?a[pi][m]:0}
function prodm(k,pi,m){var a=PR[k];return a?a[pi][m]:0}
/* media dos 3 ultimos meses fechados e acumulado saem da propria producao mensal */
function vol3(k,pi){if(!F3.length)return 0;var t=0;F3.forEach(function(m){t+=prodm(k,pi,m)});return t/F3.length}
function volac(k,pi){var t=0;for(var m=0;m<NM;m++)t+=prodm(k,pi,m);return t}

function mkey(pi,m){return st.c2+'_'+pi+'_'+m}
function mv_(pi,m){var x=MSIM[mkey(pi,m)];return x===undefined?0:x}
function setM(pi,m,x){MSIM[mkey(pi,m)]=(isNaN(x)||x<0)?0:x;draw()}

function myRank(k){return (RK[k]||{})[st.cb]||0}
function rival(me){var L=TOP[st.cb]||[];
 if(!L.length)return null;
 if(L[0]!==me)return {k:L[0],pos:1,self:false};
 return L.length>1?{k:L[1],pos:2,self:true}:null}

function pp(k,pi,m){var a=PTS[k];return a?a[pi][m]:0}                       /* pontos do produto no mês */
function pmeta(k,pi,m){var a=PCT[k];if(!a)return null;var x=a[pi][m];return x===null?null:x} /* % da meta; null = sem meta */
function cv(k,ci,m){var c=CB[ci];if(c.k==='ESC'){var e=ESC[k];return e?e[m]:0}
 var t=0;for(var i=0;i<c.p.length;i++)t+=pp(k,c.p[i][0],m);return t}
function vol(o,k,pi){return o(k,pi)}
function volRow(o,k,r){if(r.pi!==null)return vol(o,k,r.pi);
 var ci=parseInt(r.id.substr(1)),ps=CB[ci].p,t=0;for(var i=0;i<ps.length;i++)t+=vol(o,k,ps[i][0]);return t}
function moeda(v){var a=Math.abs(v);
 if(a>=1e9)return (v/1e9).toLocaleString('pt-BR',{maximumFractionDigits:2})+' bi';
 if(a>=1e6)return (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi';
 if(a>=1e3)return (v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil';
 return v.toLocaleString('pt-BR',{maximumFractionDigits:0})}
function f(x){x=Math.round(x*10)/10;return x.toLocaleString('pt-BR',{minimumFractionDigits:x%1?1:0,maximumFractionDigits:1})}

/* linhas exibidas: combos (Conjunto da Obra) ou produtos do combo escolhido */
function rows(){
 if(st.cb==='ALL')return CB.map(function(c,i){return{id:'c'+i,n:c.n,c:c.c,pi:null,get:function(k,m){return cv(k,i,m)}}});
 var ci=0;for(var i=0;i<CB.length;i++)if(CB[i].k===st.cb)ci=i;
 var c=CB[ci];
 if(!c.p.length)return[{id:'c'+ci,n:c.n,c:c.c,pi:null,get:function(k,m){return cv(k,ci,m)}}];
 return c.p.map(function(p){return{id:'p'+p[0],n:p[1],c:c.c,pi:p[0],get:function(k,m){return pp(k,p[0],m)}}});
}
function title(){if(st.cb==='ALL')return'Conjunto da Obra';for(var i=0;i<CB.length;i++)if(CB[i].k===st.cb)return CB[i].n;return''}
function sum(k){var t=0;rows().forEach(function(r){for(var m=0;m<NM;m++)t+=val(r,k,m)});return t}
function rtot(r,k){var t=0;for(var m=0;m<NM;m++)t+=val(r,k,m);return t}
function ravg3(r,k){if(!F3.length)return 0;var t=0;F3.forEach(function(m){t+=val(r,k,m)});return t/F3.length}

function head12(){var h='<th>'+lbl()+'</th>';
 for(var m=0;m<12;m++)h+='<th'+thcls(m)+'>'+MES[m]+'</th>';
 return h+'<th class="t">Total</th>'}

function tabA(me,op,self){
 var R=rows(),h='',mm=new Array(12).fill(0),mt=0;
 var noteBits=['<b>Todos os meses são editáveis</b> — já vêm preenchidos com o número da base e você pode trocar qualquer um para testar cenários.'];
 if(MF>0)noteBits.push(MES[0]+' a '+MES[MF-1]+' '+(MF>1?'são os meses já fechados':'é o mês já fechado')+' (fundo neutro).');
 if(NF>0)noteBits.push(MES[MF]+(NF>1?' a '+MES[NM-1]:'')+' ainda não '+(NF>1?'fecharam':'fechou')+' — apuração parcial, em laranja.');
 if(NS>0)noteBits.push(MES[NM]+' a Dez ainda não aconteceram, em verde: comece do zero e preencha para simular.');
 h+='<div class="blk"><div class="bt">Minha cooperativa — '+title()+'</div><div class="tw"><table><thead><tr>'+head12()+'</tr></thead><tbody>';
 R.forEach(function(r){
  var t=0,x='<tr><td><span class="dot" style="background:'+r.c+'"></span>'+r.n+'</td>';
  for(var m=0;m<12;m++){
   if(m<NM){var v=val(r,me,m);t+=v;mm[m]+=v;
    x+='<td class="'+(m<MF?'ed':'nf')+'"><input type="number" min="0" step="0.5" value="'+v+'" oninput="setP(\''+me+'\',\''+r.id+'\','+m+',parseFloat(this.value))"></td>'}
   else{var s=sv(r.id,m);t+=s;mm[m]+=s;x+='<td class="s"><input type="number" min="0" step="0.5" value="'+s+'" oninput="setS(\''+r.id+'\','+m+',parseFloat(this.value))"></td>'}}
  mt+=t;h+=x+'<td class="t">'+f(t)+'</td></tr>'});
 h+='<tr class="sum"><td>Total do mês</td>';
 for(var m=0;m<12;m++)h+='<td'+thcls(m)+'>'+f(mm[m])+'</td>';
 h+='<td class="t">'+f(mt)+'</td></tr></tbody></table></div>'+
   '<div class="note">'+noteBits.join(' ')+
   (nedit()?'<button class="btnr" onclick="resetP()">Voltar aos números da base ('+nedit()+' '+(nedit()>1?'campos alterados':'campo alterado')+')</button>':'')+'</div></div>';

 h+='<div class="blk"><div class="bt op">'+OPL+' do grupo '+GRUPO+' — '+nome(op)+'</div>'+
  '<div class="proj"><span>Projeção de '+(NS?MES[NM]+' a Dez':'')+' do concorrente:</span>'+
  '<label><input type="radio" name="pj" value="m3"'+(st.proj==='m3'?' checked':'')+' onchange="setProj(\'m3\')"> Média dos 3 últimos meses fechados</label>'+
  '<label><input type="radio" name="pj" value="man"'+(st.proj==='man'?' checked':'')+' onchange="setProj(\'man\')"> Em branco, eu preencho</label></div>'+
  '<div class="tw"><table><thead><tr>'+head12()+'</tr></thead><tbody>';
 var om=new Array(12).fill(0),ot=0;
 R.forEach(function(r){
  var t=0,x='<tr><td><span class="dot" style="background:'+r.c+'"></span>'+r.n+'</td>';
  for(var m=0;m<12;m++){
   if(m<NM){var v=val(r,op,m);t+=v;om[m]+=v;
    x+='<td class="'+(m<MF?'ed':'nf')+'"><input type="number" min="0" step="0.5" value="'+v+'" oninput="setP(\''+op+'\',\''+r.id+'\','+m+',parseFloat(this.value))"></td>'}
   else if(st.proj==='m3'){var p=ravg3(r,op);t+=p;om[m]+=p;x+='<td class="s">'+f(p)+'</td>'}
   else{var q=ov(r.id,m);t+=q;om[m]+=q;
    x+='<td class="s"><input type="number" min="0" step="0.5" value="'+q+'" oninput="setO(\''+r.id+'\','+m+',parseFloat(this.value))"></td>'}}
  ot+=t;h+=x+'<td class="t">'+f(t)+'</td></tr>'});
 h+='<tr class="sum"><td>Total do mês</td>';
 for(var m=0;m<12;m++)h+='<td'+thcls(m)+'>'+f(om[m])+'</td>';
 h+='<td class="t">'+f(ot)+'</td></tr></tbody></table></div><div class="note">'+
  'Os meses realizados dele também são editáveis, se você quiser testar outro cenário. '+
  (st.proj==='m3'?MES[NM]+' a Dez projetados pela média que ele fez de '+P_3M+' (só meses fechados).':MES[NM]+' a Dez em branco — preencha o cenário que quiser testar para ele.')+'</div></div>';

 var d=mt-ot;
 h+='<div class="tip"><b>Resultado:</b> com o que você lançou, sua cooperativa fecha em <b>'+f(mt)+'</b> pontos contra os <b>'+f(ot)+'</b> do '+OPO+'. '+
   (self?(d>=0?'Você <b>mantém a liderança</b> por '+f(d)+' pontos.':'Você <b>perde a liderança</b> por '+f(-d)+' pontos.')
        :(d>=0?'Você <b>ultrapassa</b> por '+f(d)+' pontos.':'Ainda faltam <b>'+f(-d)+'</b> pontos.'))+'</div>';
 document.getElementById('p-a').innerHTML=h;
}

/* ---- meta x producao mes a mes, produto a produto ---- */
function metaProd(me){
 var prods=[];
 if(st.cb==='ALL'){CB.forEach(function(c){c.p.forEach(function(x){prods.push({pi:x[0],n:x[1],c:c.c})})})}
 else{var ci=0;for(var i=0;i<CB.length;i++)if(CB[i].k===st.cb)ci=i;
      CB[ci].p.forEach(function(x){prods.push({pi:x[0],n:x[1],c:CB[ci].c})})}
 var h='<div class="blk" style="margin-top:24px"><div class="bt gr">Meta e produ&ccedil;&atilde;o m&ecirc;s a m&ecirc;s &mdash; '+(st.cb==='ALL'?'todos os produtos':title())+'</div>';
 if(!prods.length)return h+'<div class="tip w">O combo <b>Escolher o Sicoob</b> n&atilde;o tem produto nem meta na base de cad&ecirc;ncia &mdash; s&oacute; pontua. Escolha outro combo para ver meta e produ&ccedil;&atilde;o.</div></div>';
 h+='<div class="leg"><span><i class="y"></i>Bateu a meta</span><span><i class="n"></i>N&atilde;o bateu</span><span><i class="a"></i>Sem meta no m&ecirc;s</span></div>';
 h+='<div class="tw"><table><thead><tr><th>Produto</th><th></th>';
 for(var m=0;m<12;m++)h+='<th'+(m>=NM?' class="s"':'')+'>'+MES[m]+'</th>';
 h+='<th class="t">Total<br>'+P_REAL+'</th></tr></thead><tbody>';
 prods.forEach(function(p){
  var tm=0,tp=0,bat=0,com=0,td=0;
  var r1='<tr><td rowspan="3"><span class="dot" style="background:'+p.c+'"></span>'+p.n+'</td><td class="sm2">Meta</td>';
  var r2='<tr><td class="sm2">Produ&ccedil;&atilde;o</td>';
  var r3='<tr class="sep"><td class="sm2">% da meta</td>';
  for(var m=0;m<12;m++){
   if(m<NM){
    var vm=meta(me,p.pi,m),vp=prodm(me,p.pi,m),pc=pmeta(me,p.pi,m);
    tm+=vm;tp+=vp;
    r1+='<td'+(vm?'':' class="z"')+'>'+moeda(vm)+'</td>';
    r2+='<td'+(vp?'':' class="z"')+'>'+moeda(vp)+'</td>';
    if(pc===null)r3+='<td><span class="hit a">&ndash;</span></td>';
    else{com++;var y=pc>=100;if(y)bat++;
     r3+='<td><span class="hit '+(y?'y':'n')+'">'+(pc>=999?'999+':pc<=-999?'-999':pc)+'%</span></td>'}
   }else{
    var dg=mv_(p.pi,m);td+=dg;
    r1+='<td class="s mpin"><input type="number" min="0" step="any" placeholder="digite" value="'+(dg||'')+'" onchange="setM('+p.pi+','+m+',parseFloat(this.value))"></td>';
    r2+='<td class="s z">&mdash;</td>';
    r3+='<td class="s z">&mdash;</td>'}}
  h+=r1+'<td class="t">'+moeda(tm)+(td?'<span class="sm">+ '+moeda(td)+' digitado</span>':'')+'</td></tr>'
   +r2+'<td class="t">'+moeda(tp)+'</td></tr>'
   +r3+'<td class="t">'+bat+'/'+com+'</td></tr>'});
 h+='</tbody></table></div><div class="note"><b>'+MES[NM]+' a Dez em branco de prop&oacute;sito:</b> a base de cad&ecirc;ncia s&oacute; traz linhas at&eacute; '+MES[NM-1]+' &mdash; meta, produ&ccedil;&atilde;o e % dos meses seguintes n&atilde;o existem nela. Digite a meta quando ela sair; o total da linha mostra &agrave; parte o que voc&ecirc; digitou. O que voc&ecirc; digita vale enquanto a p&aacute;gina estiver aberta.</div></div>';
 return h;
}

function tabB(me,op,self){
 var R=rows(),h='',need=0;
 h+='<div class="blk"><div class="bt">Quanto falta em pontos — '+title()+'</div><div class="tw"><table><thead><tr>'+
  '<th>'+lbl()+'</th><th>Meus pontos</th><th>Pontos do '+OPO+'</th><th>Falta</th>'+
  '<th class="t">Falta por mês<br>'+P_SIM+'</th><th>Minha média<br>'+P_3M+'</th><th>Média do '+OPO+'<br>'+P_3M+'</th></tr></thead><tbody>';
 R.forEach(function(r){
  var a=rtot(r,me),b=rtot(r,op),gp=b-a,nd=gp>0?gp/(NS||1):0;need+=nd;
  h+='<tr><td><span class="dot" style="background:'+r.c+'"></span>'+r.n+'</td>'+
     '<td>'+f(a)+'</td><td>'+f(b)+'</td>'+
     '<td class="'+(gp>0?'neg':'pos')+'">'+(gp>0?f(gp):'—')+'</td>'+
     '<td class="t">'+f(nd)+'</td>'+
     '<td>'+f(ravg3(r,me))+'</td><td>'+f(ravg3(r,op))+'</td></tr>'});
 var A=sum(me),B=sum(op);
 h+='<tr class="sum"><td>Total</td><td>'+f(A)+'</td><td>'+f(B)+'</td><td class="'+(B>A?'neg':'pos')+'">'+(B>A?f(B-A):'—')+'</td>'+
    '<td class="t">'+f(need)+'</td><td>—</td><td>—</td></tr></tbody></table></div>';
 h+='<div class="note">Falta por mês = quanto de ponto você precisa somar em cada um dos '+NS+' meses restantes para alcançar os pontos que ele já tem.</div></div>';
 h+=self?'<div class="tip"><b>Resumo:</b> sua cooperativa lidera o grupo '+GRUPO+' em '+title()+'. Os números acima mostram a distância para o 2º colocado.</div>'
        :'<div class="tip"><b>Resumo:</b> '+f(need)+' pontos por mês, de '+P_SIM+', para alcançar o '+OPL+' do grupo '+GRUPO+' em '+title()+'.</div>';

 var semVol=(st.cb==='ESC');
 h+='<div class="blk" style="margin-top:24px"><div class="bt gr">Volume de produção em R$ — média de '+P_3M+'</div>';
 if(semVol){h+='<div class="tip w">O combo <b>Escolher o Sicoob</b> não tem produto nem volume na base de cadência — só pontua. Escolha outro combo para ver o volume em R$.</div></div>'}
 else{
 h+='<div class="tw"><table><thead><tr><th>'+lbl()+'</th>'+
  '<th>Minha média<br>por mês</th><th>Média do '+OPO+'<br>por mês</th><th>Diferença<br>por mês</th>'+
  '<th class="t">Preciso produzir<br>por mês</th><th>Meu acumulado<br>'+P_REAL+'</th><th>Acumulado do '+OPO+'<br>'+P_REAL+'</th><th>Diferença<br>acumulada</th></tr></thead><tbody>';
 var s1=0,s2=0,a1=0,a2=0;
 R.forEach(function(r){
  if(r.pi===null&&!CB[parseInt(r.id.substr(1))].p.length)return;   /* Escolher o Sicoob não tem volume */
  var v1=volRow(vol3,me,r),v2=volRow(vol3,op,r),c1=volRow(volac,me,r),c2=volRow(volac,op,r);
  s1+=v1;s2+=v2;a1+=c1;a2+=c2;
  var dm=v1-v2,da=c1-c2;
  h+='<tr><td><span class="dot" style="background:'+r.c+'"></span>'+r.n+'</td>'+
     '<td>'+moeda(v1)+'</td><td>'+moeda(v2)+'</td>'+
     '<td class="'+(dm>=0?'pos':'neg')+'">'+(dm>=0?'+':'')+moeda(dm)+'</td>'+
     '<td class="t">'+(dm>=0?'—':moeda(-dm))+'</td>'+
     '<td>'+moeda(c1)+'</td><td>'+moeda(c2)+'</td>'+
     '<td class="'+(da>=0?'pos':'neg')+'">'+(da>=0?'+':'')+moeda(da)+'</td></tr>'});
 var ds=s1-s2,daa=a1-a2;
 h+='<tr class="sum"><td>Total</td><td>'+moeda(s1)+'</td><td>'+moeda(s2)+'</td>'+
    '<td class="'+(ds>=0?'pos':'neg')+'">'+(ds>=0?'+':'')+moeda(ds)+'</td>'+
    '<td class="t">'+(ds>=0?'—':moeda(-ds))+'</td>'+
    '<td>'+moeda(a1)+'</td><td>'+moeda(a2)+'</td>'+
    '<td class="'+(daa>=0?'pos':'neg')+'">'+(daa>=0?'+':'')+moeda(daa)+'</td></tr></tbody></table></div>'+
  '<div class="note"><b>Preciso produzir por mês</b> é quanto de volume falta somar à sua média mensal para igualar a dele. Onde está — você já produz mais que ele naquele item.</div></div>';
 }

 h+='<div class="blk" style="margin-top:24px"><div class="bt op">Mês a mês — minha cooperativa menos o '+OPL+'</div><div class="tw"><table><thead><tr><th>'+lbl()+'</th>';
 for(var m=0;m<NM;m++)h+='<th'+(m>=MF?' class="nf"':'')+'>'+MES[m]+'</th>';
 h+='<th class="t">Total</th></tr></thead><tbody>';
 R.forEach(function(r){
  h+='<tr><td><span class="dot" style="background:'+r.c+'"></span>'+r.n+'</td>';
  for(var m=0;m<NM;m++){var d=val(r,me,m)-val(r,op,m);h+='<td class="'+(d>0?'pos':d<0?'neg':'z')+'">'+(d>0?'+':'')+f(d)+'</td>'}
  var da=rtot(r,me)-rtot(r,op);
  h+='<td class="t '+(da>=0?'pos':'neg')+'">'+(da>=0?'+':'')+f(da)+'</td></tr>'});
 h+='</tbody></table></div><div class="note">Verde: você fez mais pontos que ele naquele mês. Colunas em laranja: meses ainda não fechados.</div></div>';
 h+=metaProd(me);
 document.getElementById('p-b').innerHTML=h;
}

/* ---- Top 3 do grupo, no combo selecionado ---- */
function tabD(me,op){
 var L=(TOP[st.cb]||[]).slice(0,3);
 if(!L.length){document.getElementById('p-d').innerHTML='<div class="empty">Sem ranking suficiente para este combo.</div>';return}
 var R=rows(),medals=['🥇','🥈','🥉'],h='';
 h+='<div class="blk"><div class="bt">Top 3 do grupo '+GRUPO+' — '+title()+'</div>';
 h+='<div class="note" style="margin-bottom:12px">As 3 primeiras cooperativas do grupo, ponto a ponto — inclusive quando a sua não está entre elas.</div>';
 h+='<div class="cards" style="margin-bottom:18px">';
 L.forEach(function(k,i){
  var tot=sum(k),isMe=(k===me),lead=sum(L[0]),gap=lead-tot;
  h+='<div class="c'+(isMe?' gp':(i===0?' op':''))+'"><div class="lb"><span class="medcard">'+medals[i]+'</span>'+(i+1)+'º lugar'+(isMe?' · você':'')+'</div>'+
     '<div class="nm">'+nome(k)+'</div><div class="vv">'+f(tot)+'</div>'+
     '<div class="sb">pontos em '+title()+' · '+P_REAL+(i>0?' · '+f(gap)+' atrás do 1º':'')+'</div></div>'});
 h+='</div>';
 h+='<div class="tw"><table><thead><tr><th>'+lbl()+'</th>';
 L.forEach(function(k,i){h+='<th>'+medals[i]+' '+nome(k)+(k===me?' (você)':'')+'</th>'});
 h+='</tr></thead><tbody>';
 R.forEach(function(r){
  var vals=L.map(function(k){return rtot(r,k)}),mx=Math.max.apply(null,vals);
  h+='<tr><td><span class="dot" style="background:'+r.c+'"></span>'+r.n+'</td>';
  vals.forEach(function(v){h+='<td'+(v===mx&&mx>0?' class="pos" style="font-weight:800"':'')+'>'+f(v)+'</td>'});
  h+='</tr>'});
 h+='<tr class="sum"><td>Total</td>';
 L.forEach(function(k){h+='<td>'+f(sum(k))+'</td>'});
 h+='</tr></tbody></table></div>';
 h+='<div class="note">Em negrito: quem mais pontuou naquela linha. Usa o que você já ajustou nos meses ainda não fechados (aba Simulação de Pontos).</div></div>';

 h+='<div class="blk" style="margin-top:24px"><div class="bt op">Mês a mês — total das 3 primeiras</div><div class="tw"><table><thead><tr><th>Posição</th>';
 for(var m=0;m<NM;m++)h+='<th'+thcls(m)+'>'+MES[m]+'</th>';
 h+='<th class="t">Total</th></tr></thead><tbody>';
 L.forEach(function(k,i){
  h+='<tr'+(k===me?' style="background:var(--hover);font-weight:700"':'')+'><td>'+medals[i]+' '+nome(k)+(k===me?' (você)':'')+'</td>';
  var tt=0;
  for(var m=0;m<NM;m++){var v=0;R.forEach(function(r){v+=val(r,k,m)});tt+=v;h+='<td'+thcls(m)+'>'+f(v)+'</td>'}
  h+='<td class="t">'+f(tt)+'</td></tr>'});
 h+='</tbody></table></div><div class="note">Colunas em laranja: meses realizados que ainda não fecharam.</div></div>';
 document.getElementById('p-d').innerHTML=h;
}

function tabC(me,op){
 var R=rows(),h='',prod=(st.cb!=='ALL'&&R[0].pi!==null);
 h+='<div class="note" style="margin:0 0 10px">'+(prod
   ?'Bateu quando a <b>produção alcançou 100% da meta</b> do produto no mês. O número dentro do quadro é o % da meta.'
   :'Quantos produtos do combo bateram a meta em cada mês. Escolha um combo no filtro para ver produto por produto.')+'</div>'+
  '<div class="leg"><span><i class="y"></i>Bateu a meta</span><span><i class="n"></i>Não bateu</span><span><i class="p"></i>Bateu em parte</span><span><i class="a"></i>Sem meta no mês</span></div>';
 if(!prod)h+='<div class="tip w" style="margin-bottom:14px">O combo <b>Escolher o Sicoob</b> não tem meta por produto na base de cadência, por isso aparece sem marcação aqui. Os pontos dele continuam somando normalmente nas outras abas.</div>';
 h+=grid('Minha cooperativa — '+nome(me),me,R,prod,'');
 h+=grid(OPL+' do grupo '+GRUPO+' — '+nome(op),op,R,prod,'op');
 document.getElementById('p-c').innerHTML=h;
}
function grid(t,k,R,prod,cl){
 var h='<div class="blk"><div class="bt '+cl+'">'+t+'</div><div class="tw"><table><thead><tr><th>'+(prod?'Produto':'Combo')+'</th>';
 for(var m=0;m<NM;m++)h+='<th>'+MES[m]+'</th>';
 h+='<th class="t">Meses batidos</th></tr></thead><tbody>';
 R.forEach(function(r){
  var n=0;h+='<tr><td><span class="dot" style="background:'+r.c+'"></span>'+r.n+'</td>';
  for(var m=0;m<NM;m++){
   if(prod){var p=pmeta(k,r.pi,m);
    if(p===null)h+='<td><span class="hit a">–</span></td>';
    else{var y=p>=100;if(y)n++;h+='<td><span class="hit '+(y?'y':'n')+'">'+(p>=999?'999+':p<=-999?'-999':p)+'%</span></td>'}}
   else{
    var ci=parseInt(r.id.substr(1)),ps=CB[ci].p,tot=0,hit=0;
    for(var i=0;i<ps.length;i++){var q=pmeta(k,ps[i][0],m);if(q!==null){tot++;if(q>=100)hit++}}
    if(!tot)h+='<td><span class="hit a">–</span></td>';
    else{if(hit===tot)n++;h+='<td><span class="hit '+(hit===tot?'y':hit?'p':'n')+'">'+hit+'/'+tot+'</span></td>'}}}
  h+='<td class="t">'+n+'/'+NM+'</td></tr>'});
 return h+'</tbody></table></div></div>';
}
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){
 document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
 document.querySelectorAll('.pane').forEach(function(x){x.classList.remove('active')});
 t.classList.add('active');document.getElementById('p-'+t.dataset.p).classList.add('active')}});
draw();
</script>
